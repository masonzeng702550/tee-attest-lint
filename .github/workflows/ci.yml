name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" cryptography
      - name: Run tests
        run: pytest -q
      - name: Self-lint fixtures (detection-rate sanity)
        run: |
          attest-lint scan tests/fixtures/verifier_good && echo "good: clean"
          ! attest-lint scan tests/fixtures/verifier_bad/no_checks.rs && echo "bad: flagged"
